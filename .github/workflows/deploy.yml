name: Kontrollera och publicera

on:
  push:
    # Kontrollerna körs på utvecklingsgrenar också, så att fel syns direkt.
    # Publiceringen nedan är ändå låst till main.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kontrollera:
    name: Typkontroll, tester och bygge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typkontroll
        run: npm run typecheck
      - name: Enhetstester
        run: npm test
      - name: Bygg
        run: npx vite build
      - name: Röktest i webbläsare
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Spara röktestets rapport vid fel
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
          # v5 exkluderar dolda filer som standard, och dist/.nojekyll måste med.
          include-hidden-files: true

  publicera:
    name: Publicera till GitHub Pages
    needs: kontrollera
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
